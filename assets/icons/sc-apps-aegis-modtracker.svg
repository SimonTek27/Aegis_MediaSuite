<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#001100"/>
      <stop offset="100%" style="stop-color:#000800"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>
  <!-- CRT scanlines effect -->
  <rect x="12" y="14" width="104" height="100" rx="6" fill="#001a00" stroke="#00ff41" stroke-width="1.5"/>
  <!-- Tracker pattern columns - retro DOS style -->
  <!-- Col headers -->
  <rect x="16" y="18" width="24" height="8" rx="2" fill="#003300"/>
  <rect x="44" y="18" width="24" height="8" rx="2" fill="#003300"/>
  <rect x="72" y="18" width="24" height="8" rx="2" fill="#003300"/>
  <rect x="100" y="18" width="12" height="8" rx="2" fill="#003300"/>
  <!-- Pattern rows -->
  <rect x="16" y="30" width="24" height="6" rx="1" fill="#005500" opacity="0.8"/>
  <text x="18" y="36" font-family="monospace" font-size="5" fill="#00ff41">C-4 1</text>
  <rect x="44" y="30" width="24" height="6" rx="1" fill="#003300" opacity="0.8"/>
  <text x="46" y="36" font-family="monospace" font-size="5" fill="#00cc33">--- -</text>
  <rect x="16" y="40" width="24" height="6" rx="1" fill="#003300"/>
  <text x="18" y="46" font-family="monospace" font-size="5" fill="#00cc33">E-4 1</text>
  <rect x="44" y="40" width="24" height="6" rx="1" fill="#005500" opacity="0.8"/>
  <text x="46" y="46" font-family="monospace" font-size="5" fill="#00ff41">G-4 2</text>
  <rect x="72" y="40" width="24" height="6" rx="1" fill="#003300"/>
  <text x="74" y="46" font-family="monospace" font-size="5" fill="#00cc33">C-5 1</text>
  <!-- Highlight row (cursor) -->
  <rect x="14" y="52" width="100" height="8" rx="2" fill="#00aa00" opacity="0.25"/>
  <text x="18" y="58" font-family="monospace" font-size="5" fill="#ffffff">A-4 3</text>
  <text x="46" y="58" font-family="monospace" font-size="5" fill="#ffffff">F-4 1</text>
  <text x="74" y="58" font-family="monospace" font-size="5" fill="#ffffff">D-5 2</text>
  <!-- More rows -->
  <rect x="16" y="64" width="24" height="6" rx="1" fill="#003300"/>
  <text x="18" y="70" font-family="monospace" font-size="5" fill="#00cc33">--- -</text>
  <rect x="72" y="64" width="24" height="6" rx="1" fill="#005500" opacity="0.8"/>
  <text x="74" y="70" font-family="monospace" font-size="5" fill="#00ff41">B-4 1</text>
  <rect x="16" y="74" width="24" height="6" rx="1" fill="#005500"/>
  <text x="18" y="80" font-family="monospace" font-size="5" fill="#00ff41">G-4 2</text>
  <rect x="44" y="74" width="24" height="6" rx="1" fill="#003300"/>
  <text x="46" y="80" font-family="monospace" font-size="5" fill="#00cc33">E-4 1</text>
  <!-- Bottom status bar -->
  <rect x="12" y="106" width="104" height="8" rx="3" fill="#004400"/>
  <text x="20" y="112" font-family="monospace" font-size="5" fill="#00ff41">BPM:140  ROW:12/64  PAT:03</text>
</svg>
