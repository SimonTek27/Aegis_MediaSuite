<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#200122"/>
      <stop offset="100%" style="stop-color:#6f0000"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>
  <!-- Film strip -->
  <rect x="16" y="32" width="96" height="64" rx="6" fill="#1a0a0a" stroke="#ff6b6b" stroke-width="2"/>
  <!-- Sprocket holes left -->
  <rect x="20" y="38" width="10" height="14" rx="2" fill="#200122"/>
  <rect x="20" y="57" width="10" height="14" rx="2" fill="#200122"/>
  <rect x="20" y="76" width="10" height="14" rx="2" fill="#200122"/>
  <!-- Sprocket holes right -->
  <rect x="98" y="38" width="10" height="14" rx="2" fill="#200122"/>
  <rect x="98" y="57" width="10" height="14" rx="2" fill="#200122"/>
  <rect x="98" y="76" width="10" height="14" rx="2" fill="#200122"/>
  <!-- Screen area -->
  <rect x="34" y="38" width="60" height="52" rx="3" fill="#2a0a0a"/>
  <!-- Play button -->
  <polygon points="52,52 52,78 82,64" fill="#ff6b6b" opacity="0.9"/>
</svg>
