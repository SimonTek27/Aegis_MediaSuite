<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ff0080"/>
      <stop offset="100%" style="stop-color:#1a001a"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>
  <!-- Microphone body -->
  <rect x="50" y="20" width="28" height="44" rx="14" fill="#e91e8c" stroke="white" stroke-width="2"/>
  <!-- Mic grille lines -->
  <line x1="50" y1="38" x2="78" y2="38" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="48" x2="78" y2="48" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <!-- Mic stand -->
  <line x1="64" y1="64" x2="64" y2="90" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="44" y1="90" x2="84" y2="90" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Sound waves -->
  <path d="M82 30 Q92 42 82 54" fill="none" stroke="#ffcc00" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M90 24 Q104 42 90 60" fill="none" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M46 30 Q36 42 46 54" fill="none" stroke="#ffcc00" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M38 24 Q24 42 38 60" fill="none" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Musical notes -->
  <text x="20" y="108" font-size="18" fill="#ff69b4" opacity="0.8">♪</text>
  <text x="88" y="108" font-size="18" fill="#ff69b4" opacity="0.8">♪</text>
</svg>
